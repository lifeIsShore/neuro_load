# ──────────────────────────────────────────────────────────────────────────────
# NeuroLoad — Android CI/CD
# Triggers: every push to main + every PR targeting main
#
# Jobs:
#   1. test        → flutter analyze + unit tests
#   2. build_apk   → release APK (unsigned)  [push to main only]
#   3. build_aab   → release AAB for Play Store [push to main only]
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   KEYSTORE_BASE64      Base64-encoded .jks release keystore
#   KEY_ALIAS            Keystore key alias
#   KEY_PASSWORD         Key password
#   STORE_PASSWORD       Keystore store password
# ──────────────────────────────────────────────────────────────────────────────

name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.27.4"   # Pin — bump here when upgrading Flutter
  JAVA_VERSION: "17"

jobs:
  # ── 1. Analyze & Test ────────────────────────────────────────────────────────
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift + Riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  # ── 2. Build Release APK ─────────────────────────────────────────────────────
  build_apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode and convert keystore to JKS format
        run: |
          # Decode the base64 keystore (may be PKCS12 or JKS)
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release_input.jks
          # Convert to legacy JKS format that apksigner/bundletool can read
          keytool -importkeystore \
            -srckeystore android/app/release_input.jks \
            -srcstoretype PKCS12 \
            -srcstorepass "${{ secrets.STORE_PASSWORD }}" \
            -destkeystore android/app/release.jks \
            -deststoretype JKS \
            -deststorepass "${{ secrets.STORE_PASSWORD }}" \
            -noprompt 2>/dev/null || \
          # If it's already JKS (not PKCS12), just use it as-is
          cp android/app/release_input.jks android/app/release.jks
          rm -f android/app/release_input.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroload-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ── 2b. Build Debug APK (For Quick Testing) ──────────────────────────────
  build_debug_apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroload-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ── 3. Build Release AAB ─────────────────────────────────────────────────────
  build_aab:
    name: Build Release AAB (Play Store)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode and convert keystore to JKS format
        run: |
          # Decode the base64 keystore (may be PKCS12 or JKS)
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release_input.jks
          # Convert to legacy JKS format that apksigner/bundletool can read
          keytool -importkeystore \
            -srckeystore android/app/release_input.jks \
            -srcstoretype PKCS12 \
            -srcstorepass "${{ secrets.STORE_PASSWORD }}" \
            -destkeystore android/app/release.jks \
            -deststoretype JKS \
            -deststorepass "${{ secrets.STORE_PASSWORD }}" \
            -noprompt 2>/dev/null || \
          # If it's already JKS (not PKCS12), just use it as-is
          cp android/app/release_input.jks android/app/release.jks
          rm -f android/app/release_input.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Build release AAB
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroload-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
