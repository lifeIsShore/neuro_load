name: neuro_load
description: "NeuroLoad - Train Your Focus Like a Muscle"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Local Database
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Secure Storage (for DB encryption key)
  flutter_secure_storage: ^9.2.2

  # Fonts & UI
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.69.0

  # Sensors
  sensors_plus: ^5.0.1

  # Haptics (built-in Flutter SDK)
  # Local Notifications
  flutter_local_notifications: ^17.2.3

  # Preferences
  shared_preferences: ^2.3.2

  # Export / Share
  share_plus: ^10.0.2

  # Timezone support (for scheduled daily notifications)
  flutter_timezone: ^1.0.8

  # HTTP client (for Supabase REST upsert)
  http: ^1.2.2

  # Foreground service (keeps timer alive when app is backgrounded on Android)
  flutter_foreground_task: ^9.2.0

  # URL launching (Privacy Policy, ToS, Impressum links)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.3
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  # OpenDyslexic font for accessibility — add .otf files to assets/fonts/ to enable:
  # fonts:
  #   - family: OpenDyslexic
  #     fonts:
  #       - asset: assets/fonts/OpenDyslexic-Regular.otf
  #       - asset: assets/fonts/OpenDyslexic-Bold.otf
  #         weight: 700
